<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset Password | Launch My Clothing Brand</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#C8A951;--cream:#F5F0E8;--ink:#1A1208;--bg:#0E0B06;--card:#1C1609;--border:rgba(200,169,81,.22);--red:#D4472A;--green:#4CAF50}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}.card{width:100%;max-width:470px;background:var(--card);border:1px solid var(--border);padding:2.5rem}.tag{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:.8rem}h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;margin-bottom:.7rem}h1 em{color:var(--gold)}p{font-size:.76rem;opacity:.62;line-height:1.7;margin-bottom:1.6rem}.field{margin-bottom:1.2rem}.field label{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:.4rem}.field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);padding:.8rem 1rem;color:var(--cream);font:inherit;outline:none}.field input:focus{border-color:var(--gold)}button{width:100%;border:0;background:var(--gold);color:var(--ink);padding:.9rem;font:500 .82rem 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.55}.alert{display:none;padding:.8rem 1rem;margin-bottom:1rem;font-size:.75rem;line-height:1.5}.alert.show{display:block}.success{border:1px solid rgba(76,175,80,.3);color:var(--green)}.error{border:1px solid rgba(212,71,42,.3);color:var(--red)}.back{text-align:center;margin-top:1.3rem;font-size:.74rem}.back a{color:var(--gold);text-decoration:none}</style></head><body><div class="card"><div class="tag">Account Recovery</div><h1>Create a <em>New Password</em></h1><p>Open this page from the secure recovery link sent to your email, then choose a new password.</p><div id="alert" class="alert"></div><form id="resetForm"><div class="field"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" required></div><div class="field"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter password" required></div><button id="btn" type="submit">Update Password →</button></form><div class="back"><a href="/login.html">← Back to Login</a></div></div><script>
const SB_URL = 'https://tldbjsqhjqapdwmfeuwq.supabase.co';

// IMPORTANT:
// Paste the SAME current Supabase publishable key that is working in login-test.html and library-manual-test.html.
const SB_KEY = 'sb_publishable_24w5TpkTFGBCQIlFzVzUrg_-0rJm_ZZ';

const sb = supabase.createClient(SB_URL, SB_KEY, {
  auth: {
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true
  }
});

const alertBox = document.getElementById('alert');
const resetForm = document.getElementById('resetForm');
const btn = document.getElementById('btn');

function show(msg, type) {
  alertBox.textContent = msg;
  alertBox.className = 'alert show ' + type;
}

let recoveryReady = false;

async function establishRecoverySession() {
  try {
    // 1) PKCE-style recovery links may return ?code=...
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      const { data, error } = await sb.auth.exchangeCodeForSession(code);
      if (error) throw error;

      if (data?.session?.user) {
        recoveryReady = true;

        // Remove the one-time code from the visible URL after it is exchanged.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
        return true;
      }
    }

    // 2) Supabase may already have created the session from the URL hash.
    const { data: sessionData, error: sessionError } = await sb.auth.getSession();
    if (sessionError) throw sessionError;

    if (sessionData?.session?.user) {
      recoveryReady = true;
      return true;
    }

    // 3) Explicitly support older implicit-flow links containing hash tokens.
    const hash = new URLSearchParams(
      window.location.hash.startsWith('#')
        ? window.location.hash.substring(1)
        : window.location.hash
    );

    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token');
    const type = hash.get('type');

    if (accessToken && refreshToken && (!type || type === 'recovery')) {
      const { data, error } = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
      if (error) throw error;

      if (data?.session?.user) {
        recoveryReady = true;
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
        return true;
      }
    }

    return false;
  } catch (err) {
    console.error('Recovery session error:', err);
    show(
      err?.message
        ? 'Recovery link error: ' + err.message
        : 'This recovery link is invalid or has expired. Please request a new reset email.',
      'error'
    );
    return false;
  }
}

// Also listen for Supabase's PASSWORD_RECOVERY event.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && session?.user) {
    recoveryReady = true;
  }
});

(async () => {
  const ok = await establishRecoverySession();

  if (ok) {
    show('Recovery link verified. You can now choose a new password.', 'success');
  } else if (!alertBox.classList.contains('show')) {
    show(
      'Recovery session not found. Please open this page from the newest password-reset email.',
      'error'
    );
  }
})();

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password.length < 8) {
    show('Password must be at least 8 characters.', 'error');
    return;
  }

  if (password !== confirm) {
    show('Passwords do not match.', 'error');
    return;
  }

  // Re-check session immediately before changing the password.
  if (!recoveryReady) {
    const { data } = await sb.auth.getSession();
    recoveryReady = !!data?.session?.user;
  }

  if (!recoveryReady) {
    show(
      'Recovery session not found. Please request a new reset email and open the newest link.',
      'error'
    );
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  try {
    const { error } = await sb.auth.updateUser({ password });
    if (error) throw error;

    await sb.auth.signOut();
    localStorage.removeItem('lmcb_user');
    localStorage.removeItem('lmcb_current_plan');

    show('Password updated successfully. Redirecting to login...', 'success');

    setTimeout(() => {
      // During testing, return to the Supabase Auth test login page.
      window.location.href = '/login-test.html?reset=1';
    }, 1300);
  } catch (err) {
    console.error('Password update error:', err);
    show(err?.message || 'Unable to update password.', 'error');
    btn.disabled = false;
    btn.textContent = 'Update Password →';
  }
});
</script></body></html>
