// welcome bar
if (session || presetName) {
  const name = presetName ? decodeURIComponent(presetName) : (session ? session.firstName : '');
  const bar = document.getElementById('welcomeBar');
  if (bar && name) {
    bar.textContent = `👋 Welcome back, ${name}! Choose your plan below to complete your subscription.`;
    bar.classList.add('show');
  }
}

// if came from register with a preset plan, highlight it
if (presetPlan) {
  const info = document.getElementById('infoAlert');
  const planLabels = { basic: 'Basic (₹399/mo)', brand_builder: 'Brand Builder (₹999/mo)', pro_elite: 'Pro Elite (₹1999/mo)' };
  info.textContent = `You selected ${planLabels[presetPlan] || presetPlan} during registration. Click "Subscribe Now" to complete payment.`;
  info.classList.add('show');
  // scroll to that plan card
  const cardMap = { basic: 'card-basic', brand_builder: 'card-builder', pro_elite: 'card-elite' };
  setTimeout(() => {
    const el = document.getElementById(cardMap[presetPlan]);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 400);
}

// FAQ toggle
document.querySelectorAll('.faq-item').forEach(item => {
  item.querySelector('.faq-q').addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  });
});

const planNames = { basic: 'Basic', brand_builder: 'Brand Builder', pro_elite: 'Pro Elite' };

async function handleSubscribe(planKey, amount, planLabel) {
  // if no user session and no params, redirect to register
  const uid   = presetUid   || (session && session.id)    || null;
  const name  = presetName  ? decodeURIComponent(presetName)  : (session ? session.firstName + ' ' + session.lastName : '');
  const email = presetEmail ? decodeURIComponent(presetEmail) : (session ? session.email : '');
  const phone = presetPhone ? decodeURIComponent(presetPhone) : (session ? session.phone  : '');

  if (!uid) {
    window.location.href = `/register.html?plan=${planKey}`;
    return;
  }

  const options = {
    key: RZP_KEY,
    amount: amount * 100,
    currency: 'INR',
    name: 'Launch My Clothing Brand',
    description: planLabel + ' — Monthly Subscription',
    prefill: { name, email, contact: phone },
    theme: { color: '#d4a843' },
    handler: async function(response) {
      await activateSubscription(uid, planKey, amount, response.razorpay_payment_id, name, phone, planLabel);
    }
  };

  try {
    const rzp = new Razorpay(options);
    rzp.open();
  } catch(e) {
    alert('Payment error. Please contact us on WhatsApp.');
  }
}

async function activateSubscription(uid, planKey, amount, paymentId, name, phone, planLabel) {
  // update user plan status in Supabase
  await fetch(`${SB_URL}/rest/v1/users?id=eq.${uid}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` },
    body: JSON.stringify({
      plan: planKey,
      plan_amount: amount,
      payment_id: paymentId,
      plan_started: new Date().toISOString()
    })
  });

  // save payment record
  await fetch(`${SB_URL}/rest/v1/orders`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Prefer': 'return=minimal' },
    body: JSON.stringify({
      user_id: uid, plan: planKey, amount,
      payment_id: paymentId, status: 'paid',
      created_at: new Date().toISOString()
    })
  });

  // update localStorage session
  if (session) {
    session.plan = planKey;
    session.plan_status = 'active';
    localStorage.setItem('lmcb_user', JSON.stringify(session));
  }

  // notify on WhatsApp
  const msg = encodeURIComponent(`✅ New Subscription!\n\nName: ${name}\nPhone: ${phone}\nPlan: ${planLabel}\nAmount: ₹${amount}\nPayment ID: ${paymentId}`);
  window.open(`https://wa.me/${WA}?text=${msg}`, '_blank');

  // show success
  document.getElementById('successMsg').textContent = `Your ${planLabel} subscription is now active. You can now access all premium features.`;
  document.getElementById('successOverlay').classList.add('open');
}
