<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Launch My Clothing Brand</title>
  <meta name="description" content="Get in touch with Launch My Clothing Brand. Email support, office address in Bijwasan Delhi, and business hours. We respond within 24 business hours." />
  <meta name="robots" content="index, follow" />

  <!-- MOBILE BOTTOM NAVIGATION -->
      

<script>
/* Secure paid contact access */
(async function () {
  const phoneBox = document.getElementById('phoneSupportBox');
  const waBox = document.getElementById('whatsappSupportBox');
  if (!phoneBox || !waBox) return;

  // Use one auth client for this feature.
  const authClient = sb;
async function getActivePlan() {
    const { data: { session } } = await authClient.auth.getSession();
    if (!session?.user) return { session: null, plan: null };

    const { data: sub, error: subError } = await authClient
      .from('subscriptions')
      .select('plan_key,status')
      .eq('user_id', session.user.id)
      .eq('status', 'active')
      .maybeSingle();

    if (subError || !sub) return { session, plan: null };

    const { data: plan, error: planError } = await authClient
      .from('plans')
      .select('name,whatsapp_support,direct_phone_support')
      .eq('key', sub.plan_key)
      .maybeSingle();

    if (planError || !plan) return { session, plan: null };
    return { session, plan };
  }

  async function reveal(type, session) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/reveal-contact`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ type })
    });

    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Unable to open support contact.');
    return result;
  }

  const { session, plan } = await getActivePlan();

  if (!session) {
    phoneBox.innerHTML = `🔒 &nbsp; Log in to check phone support <a href="/login.html?redirect=/contact.html">→ Log In</a>`;
    waBox.innerHTML = `🔒 &nbsp; Log in to check WhatsApp support <a href="/login.html?redirect=/contact.html">→ Log In</a>`;
    return;
  }

  if (!plan) {
    phoneBox.innerHTML = `🔒 &nbsp; Subscribe to unlock phone support <a href="/subscribe.html?plan=pro_elite">→ View Plans</a>`;
    waBox.innerHTML = `🔒 &nbsp; Subscribe to unlock WhatsApp support <a href="/subscribe.html?plan=brand_builder">→ View Plans</a>`;
    return;
  }

  if (plan.direct_phone_support) {
    phoneBox.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:.55rem;align-items:flex-start;">
        <div>✓ &nbsp; Pro Elite phone support active</div>
        <a href="#" id="securePhoneReveal">→ Show Phone Number</a>
        <div id="securePhoneDetails" style="display:none;margin-top:.2rem;">
          <div id="securePhoneNumber" style="font-size:1.05rem;letter-spacing:.06em;color:#F5F0E8;margin-bottom:.45rem;"></div>
          <div style="display:flex;gap:.8rem;flex-wrap:wrap;">
            <a href="#" id="securePhoneCall">📞 Call Now</a>
            <a href="#" id="securePhoneCopy">⧉ Copy Number</a>
          </div>
        </div>
      </div>`;

    const revealLink = document.getElementById('securePhoneReveal');
    revealLink.onclick = async (e) => {
      e.preventDefault();
      revealLink.textContent = 'Checking...';

      try {
        const result = await reveal('direct_phone', session);
        if (!result?.phone) throw new Error('Phone number is not configured.');

        document.getElementById('securePhoneNumber').textContent = result.phone;
        document.getElementById('securePhoneDetails').style.display = 'block';
        revealLink.style.display = 'none';

        const callLink = document.getElementById('securePhoneCall');
        callLink.href = result.tel_url || `tel:${result.phone}`;

        document.getElementById('securePhoneCopy').onclick = async (ev) => {
          ev.preventDefault();
          try {
            await navigator.clipboard.writeText(result.phone);
            ev.currentTarget.textContent = '✓ Copied';
            setTimeout(() => ev.currentTarget.textContent = '⧉ Copy Number', 1400);
          } catch {
            alert('Phone number: ' + result.phone);
          }
        };
      } catch (err) {
        revealLink.textContent = '→ Show Phone Number';
        alert(err.message);
      }
    };
  } else {
    phoneBox.innerHTML = `🔒 &nbsp; Direct phone support is Pro Elite only <a href="/subscribe.html?plan=pro_elite">→ Upgrade</a>`;
  }

  if (plan.whatsapp_support) {
    waBox.innerHTML = `✓ &nbsp; WhatsApp support active <a href="#" id="secureWaLink">→ Open WhatsApp</a>`;
    document.getElementById('secureWaLink').onclick = async (e) => {
      e.preventDefault();
      try {
        const result = await reveal('whatsapp', session);
        if (result?.url) window.open(result.url, '_blank', 'noopener');
      } catch (err) {
        alert(err.message);
      }
    };
  } else {
    waBox.innerHTML = `🔒 &nbsp; Subscribe to unlock WhatsApp support <a href="/subscribe.html?plan=brand_builder">→ View Plans</a>`;
  }
})();
</script>

</body>
</html>
